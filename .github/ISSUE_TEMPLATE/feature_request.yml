name: Feature request
description: Suggest a new interpolation mode, API or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The gradient or effect you want, and why the current API doesn't get you there.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd like it to work. A sketch of the API call is ideal.
      render: swift
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or references
      description: Workarounds you've tried, or how other libraries, CSS or design tools handle it.
